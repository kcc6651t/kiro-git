# Reverse proxy for the central file preview service.
# Terminates TLS for browser clients and forwards to the Spring Boot app.
# The mTLS connection to Agents is made by the Spring app itself, not here.

upstream file_preview_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name file-preview.internal;

    ssl_certificate     /etc/nginx/certs/file-preview.crt;
    ssl_certificate_key /etc/nginx/certs/file-preview.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Preview payloads can be up to a few MB (base64 encoded).
    client_max_body_size 16m;

    # Basic per-IP rate limiting (define the zone in the http {} block):
    # limit_req_zone $binary_remote_addr zone=fp:10m rate=20r/s;
    # limit_req zone=fp burst=40 nodelay;

    location / {
        proxy_pass http://file_preview_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/file-preview.access.log;
    error_log  /var/log/nginx/file-preview.error.log;
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name file-preview.internal;
    return 301 https://$host$request_uri;
}
