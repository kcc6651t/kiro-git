# 所有 Agent 主机的公共变量（可被 host_vars 覆盖）
agent_home: /opt/file-preview-agent
agent_user: filepreview
agent_port: 9443

# 中心主服务出口 IP（写入 Agent 的 allowedSourceCidrs 白名单）
central_ip: 10.10.0.5
# 中心客户端证书 CN（Agent 校验的调用方身份）
central_client_cn: file-preview-main

# 控制机上的本地资源位置
certs_src_dir: "{{ playbook_dir }}/certs"                              # 证书目录：<server_id>-agent.crt/.key、main-ca.crt
agent_binary_src: "{{ playbook_dir }}/../../agent/dist/file-preview-agent"
deploy_binary: true                                                    # false 则仅下发配置，不重装二进制

# 读取安全限额默认值
denied_paths:
  - /etc/shadow
  - /etc/sudoers
  - /root
  - /home/*/.ssh/**
  - /**/id_rsa
  - /**/*.pem
  - /**/*.key
  - /proc
  - /sys
  - /dev
max_preview_bytes: 5242880
max_preview_lines: 5000
max_tail_lines: 5000
agent_api_token: ""

# 同步默认（在 host_vars 中为备机开启 write；源侧只读恒可用，无需开关）
sync_write_enabled: false
sync_target_roots: []
sync_max_chunk_bytes: 4194304
sync_max_files: 100000
